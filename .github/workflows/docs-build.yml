name: Docs Build

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Check deep-dive sources
        working-directory: docs
        run: npm run check:deep-dive

      - name: Typecheck
        working-directory: docs
        run: npm run typecheck

      - name: Build
        working-directory: docs
        run: npm run build
