name: Docs Build

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Install Doxygen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Generate API references (C + Zig)
        working-directory: docs
        run: npm run gen:api

      - name: Check deep-dive sources
        working-directory: docs
        run: npm run check:deep-dive

      - name: Check deep-dive coverage
        working-directory: docs
        run: npm run check:coverage:deep-dive

      - name: Typecheck
        working-directory: docs
        run: npm run typecheck

      - name: Build
        working-directory: docs
        run: npm run build
